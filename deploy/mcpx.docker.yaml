# mcpx inside a container.
#
# Differences from the repository example (mcpx.yaml):
#   * listen is 0.0.0.0 so a published port can reach it (127.0.0.1 inside a
#     container is not reachable from the host);
#   * the upstream points at the bundled `demo` service from
#     docker-compose.yml, so `tools/call demo_hello` works right after
#     `docker compose up`;
#   * MCPX_TOKEN is mandatory: the endpoint is published on the host, and the
#     process refuses to start when a bearer scheme has no token.
server:
  listen: 0.0.0.0:8848
  path: /mcp
  auth:
    scheme: bearer
    token_env: MCPX_TOKEN
  protocol_versions:
    - "2025-06-18"
    - "2025-03-26"
  # Empty means loopback Origins only, which covers a browser MCP client
  # talking to http://localhost:8848.
  allowed_origins: []
  max_request_bytes: 1048576
  session_ttl: 30m
  shutdown_grace: 15s

defaults:
  timeout: 10s
  max_response_bytes: 1048576
  max_body_bytes: 262144

upstreams:
  - name: demo
    base_url: http://demo:5678
    timeout: 5s
    operations:
      - name: hello
        description: Ask the bundled demo upstream for a greeting.
        method: GET
        path: /
