# mcpx example configuration.
# Every upstream is one HTTP service; every operation becomes one MCP tool
# named "<upstream>_<operation>". Credentials are environment variable names,
# never values.
server:
  listen: 127.0.0.1:8848
  path: /mcp
  # Remove this block to run without authentication (the process logs a
  # warning when you do).
  auth:
    scheme: bearer
    token_env: MCPX_TOKEN
  protocol_versions:
    - "2025-06-18"
    - "2025-03-26"
  allowed_origins:
    - "http://localhost:5173"
  max_request_bytes: 1048576
  session_ttl: 30m
  shutdown_grace: 15s

defaults:
  timeout: 15s
  max_response_bytes: 4194304
  max_body_bytes: 1048576

upstreams:
  - name: petstore
    base_url: https://petstore.example.com
    headers:
      X-Env: prod
    auth:
      scheme: bearer
      token_env: PETSTORE_TOKEN
    timeout: 10s
    allow_prefixes:
      - /api/v1
    operations:
      - name: get_pet
        description: Fetch one pet by id.
        method: GET
        path: /api/v1/pets/{id}
        params:
          - name: id
            in: path
            required: true
            description: Pet id.
            schema:
              type: string
      - name: list_pets
        description: List pets, optionally filtered by status.
        method: GET
        path: /api/v1/pets
        params:
          - name: status
            in: query
            required: false
            description: available | pending | sold
            schema:
              type: string
          - name: limit
            in: query
            required: false
            schema:
              type: integer
      - name: create_pet
        description: Create a pet.
        method: POST
        path: /api/v1/pets
        body_param: pet
        params:
          - name: pet
            in: body
            required: true
            description: Pet object, sent as JSON.
            schema:
              type: object
    # One restricted generic tool: method and path are chosen by the caller,
    # but only inside the allowlist below.
    passthrough:
      enabled: true
      name: petstore_request
      methods: [GET, POST]
      allow_prefixes: [/api/v1]

  - name: status
    base_url: http://127.0.0.1:8081
    auth:
      scheme: none
    operations:
      - name: health
        description: Read the service health document.
        method: GET
        path: /healthz
